# nginx für WorkLingo: läuft ohne Root-Rechte, liefert nur statische Dateien aus.
# HTTPS und HSTS übernimmt der vorgeschaltete Reverse-Proxy (Caddy).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temporäre Dateien liegen in /tmp (tmpfs), das Dateisystem selbst bleibt schreibgeschützt.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 15s;

    # Knappe Grenzen gegen langsame Clients und große Anfragen (es gibt nur GET/HEAD).
    client_max_body_size      1k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    reset_timedout_connection on;

    # Anfragen pro Adresse begrenzen. Bei Docker-Proxy zählt die weitergereichte Client-Adresse.
    map $http_x_forwarded_for $client_key {
        ""      $binary_remote_addr;
        default $http_x_forwarded_for;
    }
    limit_req_zone  $client_key zone=perip:2m rate=20r/s;
    limit_conn_zone $client_key zone=connperip:2m;
    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        limit_req  zone=perip burst=60 nodelay;
        limit_conn connperip 30;

        # Sicherheits-Header für alles, was keinen eigenen location-Block hat (z. B. Fehlerseiten).
        include /etc/nginx/security-headers.conf;

        # Nur lesende Methoden.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        # Versteckte Dateien nie ausliefern (außer .well-known für Zertifikate/Prüfungen).
        location ~ /\.(?!well-known) { return 404; }

        # Health-Check für Docker (ohne Log-Rauschen).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Seite und Service Worker immer frisch prüfen, damit Updates ankommen.
        location = /sw.js {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
        location = / {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            try_files /index.html =404;
        }

        # Übrige App-Dateien: kurz cachen, danach per ETag prüfen.
        location / {
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }
    }
}
